<style>

input,

textarea {

}

input:focus,
select:focus,
textarea:focus {

button {

button:active {

button:disabled {

button[style*="#64748b"] {

header > div button,

}

#menuCuenta {

}

#menuCuenta button {

}

.trabajo h3 {

.etiqueta {

a[href^="https://mpago.la"] {

}

footer {

  }

  }

.acceso-laburo {

.acceso-logo span {

.acceso-subtitulo {

}

.boton-google,

.separador::before,

.acceso-laburo label {

.acceso-laburo input {

.boton-continuar {

.acceso-empresa {

}

.acceso-empresa a {

}

@media (max-width: 600px) {
  .acceso-laburo {
    margin: 10px;
    padding: 22px 16px;
  }

  .acceso-logo {
    margin-bottom: 48px;
  }

</head>

<body>

<section id="cuentas" class="acceso-laburo">

<header>  
<div style="display:flex;align-items:center;justify-content:center;">
  <img src="file_000000006be0820e87a9e58fd4ed056f.png" alt="Laburo Cerca" style="width:300px;max-width:95%;height:auto;">
</div>
  
<p>Encontrá trabajo cerca de vos 🇦🇷</p>

<div style="display:flex;justify-content:flex-end;align-items:center;gap:8px;margin:10px 15px 0;">
  

<button type="button" style="padding:10px 18px;font-size:15px;"
  onclick="
    document.getElementById('cuentas').style.display='block';
    document.getElementById('tipoUsuario').style.display='block';

    document.getElementById('tituloCuenta').textContent='Ingresar o crear cuenta';

  ">
  Ingresar
</button>

</header>
<main>
  <section class="panel">
    <h2>🔎 Buscar trabajo</h2>
    <input id="buscar" placeholder="¿Qué trabajo buscás? Ej. albañil">

    <button type="button" onclick="mostrar()">Buscar ofertas</button>
    <button type="button" onclick="limpiar()" style="background:#64748b">

    </button>

<section class="panel">
  <h2>📢 Ofertas de trabajo</h2>
  <p class="mensaje">Ofertas publicadas en Laburo Cerca.</p>
  <div id="lista">Cargando ofertas...</div>
</section>
  

  <section class="panel">
    <h2>➕ Publicar un empleo</h2>
    <p class="mensaje">
      Completá los datos. La oferta quedará pendiente de aprobación.
    </p>

    <form id="formulario">
      <input id="puesto" name="puesto"
        placeholder="¿Qué trabajo ofrecés?" required>

       target="_blank" rel="noopener noreferrer"

<!-- Cargar Supabase antes del código de la página -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://qjtdxoupxcbbolwjugco.supabase.co";
const SUPABASE_KEY = "sb_publishable_gF3nfe2FZvsjIsZN32BK1w_IkOX26eV";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const ejemplos = [
  {
    puesto: "Ayudante de construcción",
    rubro: "Construcción",
    zona: "Don Torcuato",
    descripcion: "Ejemplo demostrativo de una oferta para ayudante de obra.",
    telefono: ""
  },
  {
    puesto: "Personal de limpieza",
    rubro: "Limpieza",
    zona: "Tigre",
    descripcion: "Ejemplo demostrativo de trabajo de limpieza.",
    telefono: ""
  },
  {
    puesto: "Ayudante de cocina",
    rubro: "Gastronomía",
    zona: "San Fernando",
    descripcion: "Ejemplo demostrativo para ayudante de cocina.",
    telefono: ""
  }
];



let ofertasReales = [];

async function cargarOfertas() {
  const lista = document.getElementById("lista");
  lista.textContent = "Conectando con Supabase...";

 const { data, error } = await supabaseClient
  .from("ofertas")
  .select("id, puesto, rubro, localidad, descripcion, contacto, estado, creada_en")
  .eq("estado", "aprobada")
  .order("creada_en", { ascending: false });

  if (error) {
    console.error("Error al cargar ofertas:", error);
    lista.textContent = "Error de Supabase: " + error.message;
    return;
  }

  ofertasReales = (data || []).map(o => ({
  puesto: o.puesto,
  rubro: o.rubro || "Otros",
  zona: o.localidad,
  descripcion: o.descripcion,
  telefono: o.contacto
}));

  mostrar();
}

function mostrar() {
  const texto = document.getElementById("buscar").value.toLowerCase().trim();
  const zona = document.getElementById("localidadBuscar").value.toLowerCase().trim();
  const rubro = document.getElementById("filtro").value;
  const lista = document.getElementById("lista");

  const resultados = ofertasReales.filter(t =>
    (t.puesto + " " + t.descripcion + " " + t.rubro)
      .toLowerCase().includes(texto) &&
    t.zona.toLowerCase().includes(zona) &&
    (!rubro || t.rubro === rubro)
  );

  lista.replaceChildren();

  if (!resultados.length) {
    lista.textContent = "Todavía no hay ofertas publicadas con esos filtros.";
    return;
  }

  resultados.forEach(t => {
    const tarjeta = document.createElement("article");
    tarjeta.className = "trabajo";

    const titulo = document.createElement("h3");
    titulo.textContent = t.puesto;

    const etiqueta = document.createElement("span");
    etiqueta.className = "etiqueta";
    etiqueta.textContent = t.rubro;

    const lugar = document.createElement("p");
    lugar.textContent = "📍 " + t.zona;

    const descripcion = document.createElement("p");
    descripcion.textContent = t.descripcion;

    const contacto = document.createElement("p");
    contacto.textContent = "Contacto: " + t.telefono;

    tarjeta.append(titulo, etiqueta, lugar, descripcion, contacto);
    lista.appendChild(tarjeta);
  });
}

function limpiar() {
  document.getElementById("buscar").value = "";
  document.getElementById("localidadBuscar").value = "";
  document.getElementById("filtro").value = "";
  mostrar();
}

function validarOferta(puesto, localidad, descripcion, contacto) {
  if (!puesto || !localidad || !descripcion || !contacto) {
    return "Completá todos los campos.";
  }

  if (puesto.length < 3 || puesto.length > 80) {
    return "El puesto debe tener entre 3 y 80 caracteres.";
  }

  if (localidad.length < 2 || localidad.length > 80) {
    return "La localidad debe tener entre 2 y 80 caracteres.";
  }

  if (descripcion.length < 10 || descripcion.length > 1500) {
    return "La descripción debe tener entre 10 y 1500 caracteres.";
  }

  const telefonoLimpio = contacto.replace(/[\s()+.-]/g, "");

  if (!/^\d{8,15}$/.test(telefonoLimpio)) {
    return "Revisá el teléfono: ingresá entre 8 y 15 dígitos.";
  }

  return "";
  }
  
cargarOfertas();
  

/* Un único evento para publicar ofertas */
const formulario = document.getElementById("formulario");

formulario.addEventListener("submit", async function(event) {
  event.preventDefault();

  const boton = document.getElementById("botonPublicar");
  const estado = document.getElementById("estadoOferta");

  if (!formulario.reportValidity()) return;

  
const puesto = document.getElementById("puesto").value.trim();
const localidad = document.getElementById("zona").value.trim();
const descripcion = document.getElementById("descripcion").value.trim();
const contacto = document.getElementById("telefono").value.trim();

const errorValidacion = validarOferta(
  puesto, localidad, descripcion, contacto
);

if (errorValidacion) {
  document.getElementById("estadoOferta").textContent = errorValidacion;
  return;
}
const rubro = document.getElementById("rubro").value;

const oferta = {
  puesto,
  rubro,
  localidad,
  descripcion,
  contacto,
  estado: "pendiente"
};

  

  boton.disabled = true;
  estado.textContent = "Enviando oferta...";

  try {
    const { error } = await supabaseClient
      .from("ofertas")
      .insert([oferta]);

    if (error) throw error;

    estado.textContent =
      "¡Oferta recibida! Será publicada después de la revisión."

    formulario.reset();

  } catch (error) {
    console.error("Error al publicar:", error);
    estado.textContent =
      "No se pudo publicar: " + (error.message || "Error desconocido");
  } finally {
    boton.disabled = false;
  }
});
/* Registro de cuentas */
async function registrarCuenta() {
  const email = document.getElementById("emailCuenta").value.trim();
  const password = document.getElementById("passwordCuenta").value;
  const tipo = document.getElementById("tipoUsuario").value;
  const estado = document.getElementById("estadoCuenta");

  if (!email || !password) {
    estado.textContent = "Ingresá tu correo y contraseña.";
    return;
  }

  if (password.length < 8) {
    estado.textContent = "La contraseña debe tener al menos 8 caracteres.";
    return;
  }

  estado.textContent = "Creando cuenta...";

  try {
    const { data, error } = await supabaseClient.auth.signUp({
      email: email,
      password: password,
      options: {
        emailRedirectTo: window.location.origin +
          window.location.pathname,
        data: {
          tipo_usuario: tipo
        }
      }
    });

    if (error) throw error;

    if (data.session) {
      estado.textContent =
        "¡Cuenta creada! Ya podés iniciar sesión.";
    } else {
      estado.textContent =
        "¡Registro iniciado! Revisá tu correo y confirmá la cuenta.";
    }
  } catch (error) {
    console.error("Error al registrar:", error);
    estado.textContent = "No se pudo crear la cuenta: " + error.message;
  }
}

/* Inicio de sesión */
async function iniciarSesion() {
  const email = document.getElementById("emailCuenta").value.trim();
  const password = document.getElementById("passwordCuenta").value;
  const estado = document.getElementById("estadoCuenta");

  if (!email || !password) {
    estado.textContent = "Ingresá tu correo y contraseña.";
    return;
  }

  estado.textContent = "Iniciando sesión...";

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) throw error;

    estado.textContent =
      "¡Sesión iniciada correctamente!";

  } catch (error) {
    console.error("Error al iniciar sesión:", error);
    estado.textContent =
      "No se pudo iniciar sesión: " + error.message;
  }
}

/* Cerrar sesión */
async function cerrarSesion() {
  const estado = document.getElementById("estadoCuenta");

  const { error } = await supabaseClient.auth.signOut();

  if (error) {
    estado.textContent = "No se pudo cerrar sesión: " + error.message;
    return;
  }

  estado.textContent = "Sesión cerrada correctamente.";
  }

</script>
</body>
</html>
